name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend and deployment scripts
        run: |
          python -m compileall ai-service/app ai-service/tests
          python -m py_compile deployment/smoke_check.py deployment/package_extension.py deployment/backup_database.py deployment/restore_database.py deployment/production_rehearsal.py deployment/seed_demo_data.py

      - name: Run backend tests
        working-directory: ai-service
        run: python -m unittest discover -s tests

      - name: Package extension dry run
        run: python deployment/package_extension.py --api http://127.0.0.1:8001 --version 0.1.0

      - name: Production rehearsal dry run
        run: python deployment/production_rehearsal.py --api http://127.0.0.1:8001 --web http://127.0.0.1:8080

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
