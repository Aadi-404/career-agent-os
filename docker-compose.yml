services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerAgentOS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - career_agent_pg:/var/lib/postgresql/data

  ai-service:
    build:
      context: ./ai-service
    environment:
      ENVIRONMENT: development
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/careerAgentOS
      LLM_MODE: mock
      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.3-70b-versatile
      EMBEDDING_PROVIDER: local
    depends_on:
      - postgres
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - ai-service
    ports:
      - "8080:80"

volumes:
  career_agent_pg:
