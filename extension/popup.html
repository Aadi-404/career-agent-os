<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career Agent OS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Career Agent OS</strong>
      <span id="status">Connecting...</span>
    </header>

    <label>
      Connect user
      <div class="inlineControl">
        <input id="userId" placeholder="local-aditya" />
        <button id="claimSession" type="button">Connect</button>
      </div>
      <small id="sessionInfo">Anonymous session will be used until a session token is created.</small>
    </label>

    <label>
      Resume
      <select id="resumeSelect"></select>
    </label>

    <section class="jobBox">
      <div>
        <strong id="jobTitle">No job parsed yet</strong>
        <small id="jobMeta">Select text on the page or paste the JD manually.</small>
      </div>
      <button id="parsePage" type="button">Parse Page</button>
    </section>

    <label>
      Manual JD fallback
      <textarea id="manualJd" placeholder="Paste role, company, and full job description when page parsing is weak."></textarea>
    </label>

    <section class="feedbackBox">
      <div>
        <strong>Parser feedback</strong>
        <small>Save this after testing a real job page.</small>
      </div>
      <div class="feedbackGrid">
        <label>
          Site
          <select id="feedbackSite">
            <option>LinkedIn</option>
            <option>Naukri</option>
            <option>Indeed</option>
            <option>Company career page</option>
            <option>Other</option>
          </select>
        </label>
        <label>
          Result
          <select id="parserRating">
            <option value="pass">Pass</option>
            <option value="partial" selected>Partial</option>
            <option value="fail">Fail</option>
          </select>
        </label>
      </div>
      <div class="checkGrid">
        <label><input id="titleFound" type="checkbox" checked /> Role</label>
        <label><input id="companyFound" type="checkbox" checked /> Company</label>
        <label><input id="descriptionFound" type="checkbox" /> JD</label>
        <label><input id="manualPasteUsed" type="checkbox" /> Manual paste</label>
      </div>
      <textarea id="feedbackNotes" class="smallText" placeholder="Example: company parsed, JD body missed, manual paste used."></textarea>
      <button id="saveParserFeedback" type="button">Save Parser Feedback</button>
    </section>

    <button id="matchJob" type="button">Match Saved Resume</button>

    <section id="result" class="result empty">No score yet.</section>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
